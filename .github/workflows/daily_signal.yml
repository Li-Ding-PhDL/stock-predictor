name: 每日选股信号推送微信

# 云端定时(GitHub 服务器跑，不用你电脑开机)：每交易日收盘后扫『暴跌抄反弹』买点 + 风险，推送到微信。
# 需要：仓库 Settings → Secrets and variables → Actions 里新增一个 Secret，名字 PUSHPLUS_TOKEN，值=你在 pushplus.plus 的 token。
# ⚠ 诚实提示：GitHub 服务器在境外，连 A 股数据(baostock)可能不稳/偶尔失败；失败时会推"数据未更新/命中0只"，据此判断。
# ⚠ 命中≠推荐买入；研究用途、非投资建议、盈亏自负。

on:
  schedule:
    # 每天(含周末)三次。信号需当天收盘才算得出，故早间/盘中推的是"上一交易日"(消息里"截至 X 日"会标明)，收盘后才是当天最新。
    - cron: "0 0 * * *"          # 00:00 UTC = 北京 08:00 —— 早间推(上一交易日信号)
    - cron: "30 5 * * *"         # 05:30 UTC = 北京 13:30 —— 盘中推(今日未收盘,仍上一交易日)
    - cron: "35 7 * * *"         # 07:35 UTC = 北京 15:35 —— 收盘后推(当天最新信号)
  workflow_dispatch: {}          # 支持在 Actions 页手动点「Run workflow」测试

permissions:
  contents: read

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  push-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖(仅计算+baostock+requests)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn matplotlib requests baostock
      - name: 更新自选数据到最新(baostock, 免注册; 境外可能失败,不阻断)
        run: python stock_predictor.py --cli --update-data --global-scope mine
        continue-on-error: true
      - name: 扫今日买点+风险并推送微信
        env:
          STOCK_LOCAL_DATA_ROOT: ${{ github.workspace }}/data_updated
          # PUSH_SPEC(推荐)=完整推送方式, 可填: 'serverchan:你的SENDKEY' / 'https://企业微信群机器人webhook' / 'pushplus:token'
          # 兼容旧的 PUSHPLUS_TOKEN(仅pushplus, 需实名)。二者都没配则只生成HTML不推送。
          PUSH_SPEC: ${{ secrets.PUSH_SPEC }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          PUSH="$PUSH_SPEC"
          if [ -z "$PUSH" ] && [ -n "$PUSHPLUS_TOKEN" ]; then PUSH="pushplus:${PUSHPLUS_TOKEN}"; fi
          if [ -z "$PUSH" ]; then
            echo "未配置推送 Secret(PUSH_SPEC 或 PUSHPLUS_TOKEN)，仅生成HTML不推送。"
            python stock_predictor.py --cli --dip-daily --dip-multi --dip-news --global-scope mine
          else
            python stock_predictor.py --cli --dip-daily --dip-multi --dip-news --global-scope mine --push "$PUSH"
          fi
      - name: 保存信号HTML为构件(Actions页可下载)
        uses: actions/upload-artifact@v4
        with:
          name: daily-signal-html
          path: 每日信号_*.html
          if-no-files-found: ignore
