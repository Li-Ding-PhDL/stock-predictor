name: CI (红线自查 + 冒烟)

# 把 CLAUDE.md 的 4 条不可触碰红线做成自动门禁：每次 push / PR 都跑。
# 只装计算依赖(不装 PySide6/akshare/baostock——它们在源码里都是可选降级)，纯离线、不联网、不需要本地数据集。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install compute deps only (可选库缺失应降级而非崩溃)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy matplotlib pytest
      - name: Import must not require optional deps (红线#5 可降级)
        run: python -c "import stock_predictor; print('import OK')"
      - name: Byte-compile
        run: python -m py_compile stock_predictor.py
      - name: Red-line + core tests
        run: python -m pytest tests/ -q
      - name: Offline synthetic smoke (结果表必须含 Naive 基准)
        run: |
          python stock_predictor.py --cli --synthetic --algos "RF,SVR" --json out.json
          python -c "import json;d=json.load(open('out.json',encoding='utf-8'));a=[r['algo'] for r in d['results']];assert any('Naive' in x for x in a),a;print('smoke OK:',a)"
